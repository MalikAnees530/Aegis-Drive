name: Android CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: this workflow only ever needs to read the code.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Secrets are passed through `env:` and never interpolated directly into
      # the shell script, so they cannot be expanded into the command line.
      #
      # Dependabot pull requests read from a separate secret store and cannot
      # see these values, so the secrets arrive empty there. Rather than fail
      # every dependency bump, fall back to a non-functional placeholder that
      # is still structurally valid, so the bump is at least compile-checked.
      - name: Inject configuration
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is unavailable (expected on Dependabot PRs). Using a placeholder; Firebase-backed behaviour is NOT verified by this run."
            cat > app/google-services.json <<'PLACEHOLDER'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "aegis-drive-ci-placeholder",
              "storage_bucket": "aegis-drive-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.malik.aegisdrive" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "ci-placeholder-not-a-real-key" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          PLACEHOLDER
          fi
          echo "GROK_API_KEY=$GROK_API_KEY" > local.properties
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aegis-drive-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore
