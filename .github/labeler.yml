# Configuration for actions/labeler@v5
#
# v5 replaced v4's bare glob lists with an explicit match-rule structure.
# Each label maps to a list of match objects; `any-glob-to-any-file` applies
# the label when ANY listed glob matches ANY changed file in the PR.
# See https://github.com/actions/labeler#create-labeleryml

android:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**/*'
          - 'build.gradle.kts'
          - 'settings.gradle.kts'
          - 'gradle/**/*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'

github:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

ai-ml:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/assets/*.tflite'
          - 'app/src/main/assets/*.task'

resources:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/main/res/**/*'
